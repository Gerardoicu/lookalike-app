spring.application.name=lookalike-backend
spring.datasource.url=${APP_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lookalike}
spring.datasource.username=${APP_DATASOURCE_USERNAME:lookalike}
spring.datasource.password=${APP_DATASOURCE_PASSWORD:lookalike}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.auth.jwt-secret=${APP_AUTH_JWT_SECRET:}
app.auth.access-token-ttl=${APP_AUTH_ACCESS_TOKEN_TTL:PT15M}
app.auth.refresh-family-ttl=${APP_AUTH_REFRESH_FAMILY_TTL:P7D}
app.auth.jwt-issuer=${APP_AUTH_JWT_ISSUER:lookalike-backend}
app.auth.jwt-audience=${APP_AUTH_JWT_AUDIENCE:lookalike-api}
app.auth.clock-skew=${APP_AUTH_CLOCK_SKEW:PT60S}
app.auth.refresh-cookie.name=__Host-refresh_token
app.auth.refresh-cookie.secure=true
app.auth.xsrf-cookie.secure=true
app.auth.local-bootstrap.enabled=${APP_AUTH_LOCAL_BOOTSTRAP_ENABLED:false}
app.auth.local-bootstrap.email=${APP_AUTH_LOCAL_BOOTSTRAP_EMAIL:}
app.auth.local-bootstrap.password=${APP_AUTH_LOCAL_BOOTSTRAP_PASSWORD:}
app.auth.local-bootstrap.roles=${APP_AUTH_LOCAL_BOOTSTRAP_ROLES:}
