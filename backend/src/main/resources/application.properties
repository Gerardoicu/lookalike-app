spring.application.name=lookalike-backend
spring.servlet.multipart.max-file-size=${LOOKALIKE_MAX_UPLOAD_SIZE:6MB}
spring.servlet.multipart.max-request-size=${LOOKALIKE_MAX_REQUEST_SIZE:8MB}
spring.servlet.multipart.file-size-threshold=${LOOKALIKE_MULTIPART_FILE_SIZE_THRESHOLD:8MB}

lookalike.security.turnstile.secret-key=${LOOKALIKE_TURNSTILE_SECRET_KEY:}
lookalike.security.turnstile.expected-hostnames=${LOOKALIKE_TURNSTILE_EXPECTED_HOSTNAMES:}
lookalike.security.turnstile.expected-action=${LOOKALIKE_TURNSTILE_EXPECTED_ACTION:}
lookalike.security.visitor-cookie.signing-secret=${LOOKALIKE_VISITOR_COOKIE_SIGNING_SECRET:}
lookalike.security.visitor-cookie.secure=${LOOKALIKE_VISITOR_COOKIE_SECURE:false}
lookalike.security.visitor-cookie.max-age=${LOOKALIKE_VISITOR_COOKIE_MAX_AGE:30d}
lookalike.security.visitor-cookie.cooldown=${LOOKALIKE_ANALYSIS_COOLDOWN:10m}
lookalike.security.rate-limit.capacity=${LOOKALIKE_RATE_LIMIT_CAPACITY:20}
lookalike.security.rate-limit.window=${LOOKALIKE_RATE_LIMIT_WINDOW:1m}
lookalike.security.rate-limit.cleanup-interval=${LOOKALIKE_RATE_LIMIT_CLEANUP_INTERVAL:5m}
lookalike.security.request-limit.max-known-content-length-bytes=${LOOKALIKE_MAX_KNOWN_CONTENT_LENGTH_BYTES:8388608}
lookalike.security.siteverify.connect-timeout=${LOOKALIKE_TURNSTILE_SITEVERIFY_CONNECT_TIMEOUT:2s}
lookalike.security.siteverify.read-timeout=${LOOKALIKE_TURNSTILE_SITEVERIFY_READ_TIMEOUT:5s}
lookalike.face.analysis.max-image-bytes=${LOOKALIKE_FACE_MAX_IMAGE_BYTES:6291456}
lookalike.face.analysis.max-width=${LOOKALIKE_FACE_MAX_WIDTH:4096}
lookalike.face.analysis.max-height=${LOOKALIKE_FACE_MAX_HEIGHT:4096}
lookalike.face.analysis.max-pixels=${LOOKALIKE_FACE_MAX_PIXELS:12000000}
lookalike.face.analysis.detector-input-size=${LOOKALIKE_FACE_DETECTOR_INPUT_SIZE:320}
lookalike.face.analysis.min-face-confidence=${LOOKALIKE_FACE_MIN_CONFIDENCE:0.9}
lookalike.face.analysis.model-directory=${LOOKALIKE_AI_MODEL_DIR:}
