name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: app_foundation_ci
          POSTGRES_USER: app_foundation_ci
          POSTGRES_PASSWORD: app_foundation_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_foundation_ci -d app_foundation_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_DATASOURCE_URL: jdbc:postgresql://localhost:5432/app_foundation_ci
      APP_DATASOURCE_USERNAME: app_foundation_ci
      APP_DATASOURCE_PASSWORD: app_foundation_ci
      APP_AUTH_JWT_SECRET: ci-only-jwt-secret-not-for-real-use-0001

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java
        # actions/setup-java v5.7.0
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend verification
        working-directory: backend
        run: ./mvnw verify -Pintegration
